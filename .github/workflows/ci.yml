name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flag_it
          POSTGRES_PASSWORD: flag_it
          POSTGRES_DB: flag_it_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flag_it -d flag_it_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      FLAG_IT_TEST_DATABASE_URL: postgresql://flag_it:flag_it@localhost:5432/flag_it_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the schema check reads main's manifest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest
      - name: Schema check against main
        run: |
          git show origin/main:src/flag_it/contracts/schema/manifest.json > "$RUNNER_TEMP/base.json" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/base.json"  # first PR: main has no manifest yet
          python -m flag_it.contracts.schema_export --check --base "$RUNNER_TEMP/base.json"
