# Tolerances for verifying a receipt against its card transaction. See "Receipt extraction" in docs/contracts.md.
total_tolerance: "0.50"       # dollars between the receipt total and the card amount
date_tolerance_days: 3        # card transactions often post a day or two after the receipt date
merchant_min_similarity: 0.6  # 0 to 1, after cleaning both names; 1.0 when one name contains the other
