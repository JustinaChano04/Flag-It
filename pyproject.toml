[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flag-it"
version = "0.1.0"
description = "Transaction review agent: checks card expenses against a spending policy."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
explore = [
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flag_it.contracts" = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
