# The laptop's services (see "Containers" in docs/tech-stack.md).
# Start Postgres: docker compose -f deploy/compose.laptop.yaml up -d --wait postgres
# Start Redis: docker compose -f deploy/compose.laptop.yaml up -d --wait redis
# Start the worker (Redis, Postgres and MinIO first): docker compose -f deploy/compose.laptop.yaml up -d worker
# The API and the UI are added by the plans that build them.
name: flag-it

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: flag_it
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flag_it}  # local development only
      POSTGRES_DB: flag_it
    ports:
      - "127.0.0.1:${FLAG_IT_PG_PORT:-5432}:5432"  # this machine only: the default password is not for a network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h makes this a TCP check. Without it the check can pass on the image's temporary init
      # server, before flag_it_test exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U flag_it -d flag_it"]
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flag_it}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flag_it_minio}  # local development only
    ports:
      - "127.0.0.1:${FLAG_IT_MINIO_PORT:-9000}:9000"  # this machine only, like Postgres
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${FLAG_IT_REDIS_PORT:-6379}:6379"  # this machine only, like Postgres
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The pipeline worker (src/flag_it/workers/settings.py): every stage job and the sweeps.
  # It runs the repo from the host folder; a slim worker image replaces this when images are built.
  worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app
    command: sh -c "pip install -q -e . && python -m arq flag_it.workers.settings.WorkerSettings"
    environment:
      FLAG_IT_DATABASE_URL: postgresql://flag_it:${POSTGRES_PASSWORD:-flag_it}@postgres:5432/flag_it
      FLAG_IT_REDIS_URL: redis://redis:6379/0
      FLAG_IT_MINIO_ENDPOINT: minio:9000
      FLAG_IT_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-flag_it}
      FLAG_IT_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-flag_it_minio}
      FLAG_IT_OLLAMA_URL: ${FLAG_IT_OLLAMA_URL:-http://host.docker.internal:11434}
      FLAG_IT_READER_MODEL: ${FLAG_IT_READER_MODEL:-qwen3-vl:8b-q4_K_M}
      FLAG_IT_JUDGE_MODEL: ${FLAG_IT_JUDGE_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
